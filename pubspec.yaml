name: voicex_movil
description: "EPUB reader with neural TTS voices for Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.0.0

  # Storage
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3

  # Audio
  just_audio: ^0.9.40

  # TTS / WebSocket
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  flutter_tts: ^4.0.2

  # EPUB
  epubx: ^4.0.0
  html: ^0.15.4

  # File picker
  file_picker: ^8.1.3

  # Utilities
  uuid: ^4.4.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
