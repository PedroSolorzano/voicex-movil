name: voicex_movil
description: "EPUB reader with neural TTS voices for Android."
publish_to: 'none'
version: 0.8.0-preview.1+4

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.0.0

  # Storage
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3

  # Audio
  just_audio: ^0.9.40

  # TTS / WebSocket
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  # Motor de voz del propio teléfono: el único que lee sin red ni servidor.
  flutter_tts: ^4.0.2

  # EPUB
  epubx: ^4.0.0
  html: ^0.15.4

  # File picker
  file_picker: ^8.1.3

  # Utilities
  uuid: ^4.4.0
  crypto: ^3.0.7
  package_info_plus: ^9.0.1
  audio_session: ^0.1.25
  audio_service: ^0.18.19
  scrollable_positioned_list: ^0.3.8
  connectivity_plus: ^7.3.1
  # Notas de voz en los reportes: escribir un párrafo en el teléfono es la
  # mejor forma de no recibir feedback de alguien no técnico.
  record: ^5.1.2
  # Mantener la pantalla encendida leyendo en silencio. El WAKE_LOCK del
  # manifest solo mantiene viva la CPU para el audio, no la pantalla.
  wakelock_plus: ^1.5.2

# `record` resuelve un record_linux 0.7.2 que implementa una interfaz anterior
# a la que el propio paquete pide, y la compilación falla aunque la app sea solo
# de Android: el plugin federado entra igual en el grafo. 1.3.1 es la versión
# más nueva que encaja con nuestro SDK.
dependency_overrides:
  record_linux: 1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Runs the real SQLite schema on the desktop, so the cache repositories can
  # be tested without a device.
  sqflite_common_ffi: ^2.3.3
  # Fake PathProviderPlatform for tests that import an EPUB: there is no
  # platform implementation for getApplicationDocumentsDirectory() under
  # `flutter test`.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  # Dos libros de dominio público verificado (Project Gutenberg), uno en cada
  # idioma que la app sabe leer, para que una instalación nueva no arranque
  # con la biblioteca vacía. Ver LibraryNotifier._seedDemoLibraryIfNeeded.
  assets:
    - assets/demo/
