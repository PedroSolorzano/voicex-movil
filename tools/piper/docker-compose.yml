# Servidor de voz Piper.
#
#   docker compose -f tools/piper/docker-compose.yml up -d --build
#
# El teléfono se conecta a http://<IP-de-esta-máquina>:5000
services:
  piper:
    build:
      context: .
      # Un modelo por idioma: las voces de Piper no son multilingües. Para
      # cambiarlas, edita estos valores y reconstruye. El catálogo está en
      # https://huggingface.co/rhasspy/piper-voices
      args:
        VOICE_ES: es_AR-daniela-high
        VOICE_ES_PATH: es/es_AR/daniela/high
        VOICE_EN: en_US-lessac-high
        VOICE_EN_PATH: en/en_US/lessac/high
    container_name: voicex-piper
    restart: unless-stopped
    ports:
      - "0.0.0.0:5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5000/info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
