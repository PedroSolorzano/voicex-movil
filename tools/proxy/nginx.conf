worker_processes 1;

events {
    worker_connections 256;
}

http {
    # No anunciar la versión: es información gratis para quien escanea.
    server_tokens off;

    # Las claves del mapa son cadenas "Bearer <32 bytes en base64>", bastante
    # más largas que el bucket por defecto de 64 bytes; sin esto nginx no
    # arranca.
    map_hash_bucket_size 256;
    map_hash_max_size    2048;

    # ------------------------------------------------------------------
    # Identidad: token -> alias del probador.
    #
    # El mismo mapa hace tres trabajos: autentica (si no hay alias, 401),
    # da la clave del límite de ritmo, y pone el nombre en el log. Revocar
    # a alguien es borrar su línea y recargar, sin cortar a los demás.
    # ------------------------------------------------------------------
    include /etc/nginx/tokens.conf;

    # ------------------------------------------------------------------
    # Log de acceso
    #
    # JSON por línea para poder analizarlo con jq en vez de con expresiones
    # regulares. Un fichero por día: nginx admite variables en la ruta, así
    # que la rotación sale sola sin logrotate ni sidecar.
    #
    # LO QUE NUNCA SE REGISTRA, y no por olvido:
    #
    #   $request_body        — ahí va el párrafo del libro que alguien está
    #                          leyendo. Es lectura personal, no telemetría.
    #                          Se registra su longitud (X-Voicex-Chars, que
    #                          declara la app), nunca su texto. Y no es solo
    #                          una promesa: al no estar en el log_format,
    #                          nginx ni siquiera lo retiene para esto.
    #   $http_authorization  — el token en claro. La identidad viaja como
    #                          alias, que es todo lo que hace falta saber.
    #   $remote_addr         — la IP de una conexión móvil dice operador y
    #                          zona aproximada de un familiar. El alias ya
    #                          identifica quién es; se guarda solo la /24.
    #
    # Si algún día falta un dato, la salida fácil será añadir el cuerpo.
    # Este comentario está aquí para que ese cambio cueste escribirlo.
    # ------------------------------------------------------------------
    map $remote_addr $client_net {
        "~^(?<net>\d+\.\d+\.\d+)\.\d+$" "$net.0";
        default                          "otra";
    }

    log_format voicex escape=json
        '{'
        '"ts":"$time_iso8601",'
        '"tester":"$tester",'
        '"net":"$client_net",'
        '"engine":"$http_x_voicex_engine",'
        '"endpoint":"$uri",'
        '"method":"$request_method",'
        '"status":"$status",'
        '"req_ms":"$request_time",'
        '"upstream_ms":"$upstream_response_time",'
        '"connect_ms":"$upstream_connect_time",'
        '"bytes":"$body_bytes_sent",'
        '"req_bytes":"$request_length",'
        '"chars":"$http_x_voicex_chars",'
        '"attempt":"$http_x_voicex_attempt",'
        '"app":"$http_x_voicex_client"'
        '}';

    # Fichero fijo, no una ruta con variables: nginx resuelve esas rutas en
    # cada petición y falla al comprobarlas, dejando el log vacío sin decirlo.
    # La rotación la hace rotate.sh con `nginx -s reopen`, que es la forma
    # estándar y no obliga a un sidecar de logrotate.
    access_log /var/log/voicex/access.jsonl voicex;
    error_log  /var/log/voicex/error.log warn;

    # ------------------------------------------------------------------
    # Límites
    #
    # Con el token dentro del APK, esto es lo que convierte el peor caso de
    # "mi CPU al servicio de internet" en "una cola lenta". Se aplica sobre
    # hechos -peticiones y conexiones-, nunca sobre lo que el cliente diga
    # de sí mismo.
    #
    # Kokoro tarda ~5 s por párrafo y la descarga de un capítulo va en
    # serie, así que el uso legítimo no pasa de ~12/min: 60/min sobra para
    # leer y estorba para abusar.
    # ------------------------------------------------------------------
    limit_req_zone  $tester             zone=portester:1m rate=60r/m;
    limit_conn_zone $tester             zone=contester:1m;
    # Segunda reja por IP para que el ruido de escaneo no consuma
    # trabajadores ni llene el disco de líneas 401.
    limit_req_zone  $binary_remote_addr zone=porip:1m     rate=120r/m;

    limit_req_status  429;
    limit_conn_status 429;

    # Un párrafo, no un libro.
    client_max_body_size 32k;

    proxy_http_version 1.1;
    # La app decide cómo parsear la respuesta mirando el content-type, así
    # que el proxy no reescribe cabeceras ni interpone páginas propias.
    proxy_set_header Host $host;

    server {
        # 0.0.0.0 a propósito: alcanzable por la LAN y por la tailnet, y
        # ambas exigen token. Kokoro y Piper, en cambio, ya solo escuchan en
        # loopback (ver sus compose), así que este es el único camino.
        listen 8080;

        limit_req  zone=porip burst=40 nodelay;

        # Sin alias no se pasa de aquí. Va antes que cualquier ruta.
        if ($tester = "") {
            return 401;
        }

        limit_req  zone=portester burst=20 nodelay;
        limit_conn contester 2;

        # --------------------------------------------------------------
        # Lista blanca: seis rutas exactas y su método.
        #
        # Kokoro-FastAPI publica además /docs, /redoc y /v1/models. Nada de
        # eso tiene por qué existir de cara a internet, y una lista blanca
        # es la única forma de que no exista.
        # --------------------------------------------------------------
        location = /kokoro/health {
            limit_except GET { deny all; }
            proxy_read_timeout 10s;
            proxy_pass http://127.0.0.1:8880/health;
        }

        location = /kokoro/v1/audio/voices {
            limit_except GET { deny all; }
            proxy_read_timeout 15s;
            proxy_pass http://127.0.0.1:8880/v1/audio/voices;
        }

        location = /kokoro/dev/captioned_speech {
            limit_except POST { deny all; }
            # Por encima de los 180 s que la app concede a la síntesis, para
            # que sea siempre el cliente quien decida rendirse.
            proxy_read_timeout 240s;
            # Sin esto nginx escribiría megabytes a disco antes de empezar a
            # responder, sumando latencia justo donde ya sobra.
            proxy_buffering off;
            proxy_pass http://127.0.0.1:8880/dev/captioned_speech;
        }

        location = /piper/info {
            limit_except GET { deny all; }
            proxy_read_timeout 10s;
            proxy_pass http://127.0.0.1:5000/info;
        }

        location = /piper/voices {
            limit_except GET { deny all; }
            proxy_read_timeout 15s;
            proxy_pass http://127.0.0.1:5000/voices;
        }

        location = /piper/synthesize {
            limit_except POST { deny all; }
            proxy_read_timeout 180s;
            proxy_buffering off;
            proxy_pass http://127.0.0.1:5000/synthesize;
        }

        # Todo lo demás no existe.
        location / {
            return 404;
        }
    }
}
